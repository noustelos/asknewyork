<!DOCTYPE html>
<!-- Source for og-image.png (1200×630). The card sits in a 20px paper margin so the
     screenshot can be center-cropped past headless Chrome's rounded window corners:

     chrome --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=2 \
       --window-size=1240,670 --virtual-time-budget=10000 --screenshot=og-big.png og-card.html
     sips -c 1260 2400 og-big.png --out og-crop.png && sips -z 630 1200 og-crop.png --out og-image.png
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300..700;1,300..700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet" />
<style>
  /* Gotham Deco tokens — mirror index.html :root */
  :root {
    --paper: #F7F3EA;
    --ink: #1C1B18;
    --ink-55: rgba(28, 27, 24, 0.56);
    --brass: #8C6A2F;
    --brass-deep: #6A4D1E;
    --brass-line: rgba(140, 106, 47, 0.32);
    --emerald: #14453D;
    --diamond-grad: linear-gradient(135deg, #B08A45, #6A4D1E);
    --wordmark-grad: linear-gradient(180deg, #5C4A2A, #1C1B18);
    --font-display: "Playfair Display", Georgia, serif;
    --font-ui: "Jost", system-ui, -apple-system, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1240px; height: 670px; overflow: hidden; background: var(--paper); }
  .card {
    position: relative;
    width: 1200px; height: 630px;
    margin: 20px;
    overflow: hidden;
    background:
      radial-gradient(110% 80% at 86% -12%, rgba(140,106,47,0.08), transparent 58%),
      radial-gradient(90% 70% at -8% 104%, rgba(140,106,47,0.06), transparent 55%),
      linear-gradient(180deg, #F7F3EA 0%, #F1EADA 100%);
    font-family: var(--font-ui);
    color: var(--ink);
  }

  /* 'Midtown View' line-art, bottom-right — same artwork as the page */
  .deco-skyline {
    position: absolute; right: -30px; bottom: -64px;
    width: 640px; color: var(--brass);
    opacity: 0.9;
  }
  .deco-skyline svg { display: block; width: 100%; height: auto; }

  .inner {
    position: relative; z-index: 1;
    height: 100%;
    padding: 64px 80px 56px;
    display: flex; flex-direction: column;
  }

  .brand { display: flex; align-items: center; gap: 20px; }
  .mark {
    width: 58px; height: 58px; border-radius: 50%;
    border: 2px solid var(--brass-line);
    box-shadow: inset 0 0 16px rgba(140, 106, 47, 0.18);
    display: flex; align-items: center; justify-content: center;
  }
  .mark .diamond {
    width: 19px; height: 19px; border-radius: 3px;
    background: var(--diamond-grad);
    transform: rotate(45deg);
  }
  .wordmark {
    font-family: var(--font-display); font-weight: 400;
    font-size: 30px; letter-spacing: 0.28em; padding-left: 0.28em;
  }
  .wordmark .name {
    background: var(--wordmark-grad);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .wordmark .tld { color: var(--brass); }

  .display {
    margin-top: 64px;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 150px; line-height: 0.92;
    letter-spacing: -0.01em;
  }
  .display .accent { color: var(--brass); }

  .tagline {
    margin-top: 36px;
    font-size: 28px; font-weight: 300;
    color: var(--ink-55);
    letter-spacing: 0.01em;
  }

  /* the deco-emerald conversion moment, as on the page */
  .acquire {
    margin-top: auto;
    display: inline-flex; align-items: center; gap: 14px;
    align-self: flex-start;
    padding: 15px 28px;
    border: 1px solid rgba(20, 69, 61, 0.42);
    border-radius: 999px;
    background: #fff;
    color: var(--emerald);
    font-size: 20px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
  }
  .acquire .diamond {
    width: 10px; height: 10px; border-radius: 2px;
    background: var(--emerald);
    transform: rotate(45deg);
  }
</style>
</head>

</html>
